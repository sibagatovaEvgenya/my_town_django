<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Уфа - столица Башкортостана {% endblock%}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <div class="logo">
                <h1>Город Уфа</h1>
                <p>Столица Республики Башкортостан</p>                          
            </div>

            <nav class="nav-menu">
                <ul>
                    <li><a href="{% url 'home_page' %}">Главная</a></li>
                    <li><a href="{% url 'news' %}">Новости</a></li>
                    <li><a href="{% url 'management' %}">Руководство</a></li>
                    <li><a href="{% url 'facts' %}">Факты</a></li>
                    <li><a href="{% url 'contacts' %}">Контакты</a></li>
                    <li><a href="{% url 'history' %}" class="active">История</a></li>                
            </ul>
            
        </nav>

        </div>
        
    </header>

    <main class="main">
        <div class="container">
            {% block content %}
            {% endblock%}

        </div>
    </main>
    
    <footer class="footer">
        <div class="container">
            <p>© 2025 Город Уфа. Учебный проект.</p>        
    </div>    
    </footer>

    <script src="{% static 'js/index.js' %}"></script>
       
</body>
</html>
